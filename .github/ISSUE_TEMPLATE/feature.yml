name: Feature request
description: A new metric, collector, receiver or setting.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What do you need, and why?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where does the data come from?
      description: For a new metric, the Android API or command, and the Android versions it works on, if you know.
