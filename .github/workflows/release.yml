# Builds a signed release APK and puts it on GitHub Releases. Runs on a tag v1.2.3.
# The signing key comes from the repo secrets (docs/release.md). Without them the job fails:
# it never publishes an unsigned APK.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode the keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 is not set (docs/release.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "android-otel-device-agent-$VERSION.apk"

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "android-otel-device-agent-${GITHUB_REF_NAME#v}.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android-otel-device-agent-${GITHUB_REF_NAME#v}.apk"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "$GITHUB_REF_NAME" --generate-notes
